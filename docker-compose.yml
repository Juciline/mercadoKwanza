version: "3.8"

services:
  mysql-master:
    image: mysql:8.0
    container_name: mercadokwanza-master
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./dados:/docker-entrypoint-initdb.d
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-do-db=mercadokwanza

  mysql-slave1:
    image: mysql:8.0
    container_name: mercadokwanza-slave1
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --relay-log=relay-log

  mysql-slave2:
    image: mysql:8.0
    container_name: mercadokwanza-slave2
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --relay-log=relay-log
